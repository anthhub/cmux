cmux:
  socket_path: "" # empty = auto-discover

ai:
  default_agent: "claude" # claude | codex | shell
  workdir: "" # empty = current repo
  claude_path: "claude"
  claude_model: ""
  claude_permission_mode: "default"
  codex_path: "codex"
  codex_model: ""
  codex_sandbox: "workspace-write"

telegram:
  enabled: true
  bot_token: "" # set via TELEGRAM_BOT_TOKEN env var or here

slack:
  enabled: false
  bot_token: ""
  app_token: ""

feishu:
  enabled: false
  app_id: ""
  app_secret: ""

security:
  allowed_users: [] # empty = allow all; add user IDs to restrict
