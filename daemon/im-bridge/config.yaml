cmux:
  socket_path: "" # empty = auto-discover

ai:
  default_agent: "claude" # claude | codex | shell
  workdir: "" # empty = current repo
  claude_path: "claude"
  claude_model: ""
  claude_permission_mode: "default"
  codex_path: "codex"
  codex_model: ""
  codex_sandbox: "workspace-write"

telegram:
  enabled: true
  bot_token: "" # set via TELEGRAM_BOT_TOKEN env var or here

slack:
  enabled: false
  bot_token: ""
  app_token: ""

feishu:
  enabled: false
  app_id: "" # set via FEISHU_APP_ID env var or here
  app_secret: "" # set via FEISHU_APP_SECRET env var or here

discord:
  enabled: false
  bot_token: "" # set via DISCORD_BOT_TOKEN env var or here

wechat:
  enabled: false
  bot_token: "" # set via WECHAT_BOT_TOKEN env var or QR code login
  credentials_dir: "" # default: ~/.weclaw/accounts

security:
  allowed_users: [] # empty = allow all; add user IDs to restrict
